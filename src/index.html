<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>LLM Workspace</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Cliente web para trabajar con LLMs: chats, proyectos y contexto de código. Todo en tu navegador."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      /* Aplica el tema guardado antes del primer render para evitar parpadeos. */
      (function () {
        var id = 'system';
        try {
          id = localStorage.getItem('lwc.theme') || 'system';
        } catch (e) {}
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', id === 'system' ? (dark ? 'dark' : 'light') : id);
      })();
    </script>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--background);
      }
      .boot span {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--border-strong);
        border-top-color: var(--accent);
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2f6fed" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  </head>
  <body>
    <app-root
      ><div class="boot" aria-label="Cargando"><span></span></div
    ></app-root>
    <noscript>Esta aplicación necesita JavaScript.</noscript>
  </body>
</html>
